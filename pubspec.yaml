name: event_hub_mobile
description: "Event Hub mobile app: browse events, book tickets, pay with Stripe and show ticket QR codes."
# Keeps the package from being published to pub.dev by accident.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  lucide_icons_flutter: ^3.1.17
  intl: ^0.20.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.0.0
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  flutter_stripe: ^14.2.0
  qr_flutter: ^4.1.0
  uuid: ^4.6.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    # Accent font for the user's name on Home (SIL Open Font License).
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
